name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'AIStudio.xcodeproj/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore milestone source (bootstrap)
        id: bootstrap
        if: hashFiles('Package.swift') == '' && hashFiles('Packages/StudioKit/Package.swift') == ''
        run: |
          set -e
          echo '' | base64 -d > /tmp/src.zip
          unzip -oq /tmp/src.zip -d "$GITHUB_WORKSPACE"
          echo "restored=true" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE"

      - name: Commit restored source
        if: steps.bootstrap.outputs.restored == 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "ai-studio-ci"
          git config user.email "ci@users.noreply.github.com"
          git rm -f --ignore-unmatch '1-PROVIDER_MATRIX.md' '2-AIStudio-M0-source.zip' || true
          git add -A
          git commit -m "M1: provider kit, failover and Model Manager [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Swift package tests
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/Packages/StudioKit"
          swift test

      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Simulator smoke and first-screen screenshot
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio -configuration Debug \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO -derivedDataPath build/Simulator build
          xcrun simctl install "$DEVICE" build/Simulator/Build/Products/Debug-iphonesimulator/AIStudio.app
          xcrun simctl launch "$DEVICE" app.pindpilot.aivideostudio
          sleep 10
          mkdir -p docs/screenshots
          xcrun simctl io "$DEVICE" screenshot docs/screenshots/M3-create.png
          git config user.name "ai-studio-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs/screenshots/M3-create.png
          git commit -m "Record simulator first-screen smoke screenshot [skip ci]" || true
          git push origin HEAD:main

      - name: Package unsigned IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP_PATH=$(find build/DerivedData/Build/Products -name '*.app' -maxdepth 4 | head -1)
          echo "App bundle: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q AIStudio-unsigned.ipa Payload
          ls -la AIStudio-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIStudio-unsigned-ipa
          path: build/AIStudio-unsigned.ipa
          retention-days: 14
