name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'AIStudio.xcodeproj/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore M0 source (bootstrap)
        if: hashFiles('Package.swift') == '' && hashFiles('Packages/StudioKit/Package.swift') == ''
        run: |
          set -e
          echo '' | base64 -d > /tmp/src.zip
          unzip -oq /tmp/src.zip -d "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

      - name: Commit restored source
        if: hashFiles('Package.swift') == '' && hashFiles('Packages/StudioKit/Package.swift') == ''
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "ai-studio-ci"
          git config user.email "ci@users.noreply.github.com"
          git rm -f --ignore-unmatch '1-PROVIDER_MATRIX.md' '2-AIStudio-M0-source.zip' || true
          git add -A
          git commit -m "M0: restore StudioKit scaffold [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Swift package tests
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/Packages/StudioKit"
          swift test

      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP_PATH=$(find build/DerivedData/Build/Products -name '*.app' -maxdepth 4 | head -1)
          echo "App bundle: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q AIStudio-unsigned.ipa Payload
          ls -la AIStudio-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIStudio-unsigned-ipa
          path: build/AIStudio-unsigned.ipa
          retention-days: 14
